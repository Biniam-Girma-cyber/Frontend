<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DataSync Pro | Sign In</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/style/signinstyle.css">

</head>


<body>

    <div class="signin-page">

        <!-- ================= IMAGE SIDE ================= -->

        <section class="signin-image">

            <div class="image-overlay">

                <div class="brand">
                    <div class="brand-icon">D</div>
                    <span>DataSync Pro</span>
                </div>

                <div class="image-text">
                    <p>DATA MANAGEMENT PLATFORM</p>

                    <h1>
                        Manage your data.
                        <br>
                        Grow your business.
                    </h1>

                    <p>
                        Powerful analytics and intuitive tools
                        designed to help your team work smarter.
                    </p>
                </div>

            </div>

        </section>


        <!-- ================= FORM SIDE ================= -->

        <section class="signin-form-side">

            <div class="signin-mobile-header">

                <button type="button" class="mobile-nav-icon" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>

                <strong>DataSync Pro</strong>

                <button type="button" class="mobile-nav-icon notification-grid" aria-label="Applications"><i class="fa-solid fa-table-cells-large"></i><span class="mobile-badge">3</span></button>

            </div>


            <div class="signin-card">

                <p class="eyebrow">WELCOME BACK</p>

                <h1>Sign In</h1>

                <p class="subtitle">
                    Enter your credentials to access your account.
                </p>


                <form>

                    <div class="form-group">

                        <label for="email">Email</label>

                        <input type="email" id="email" name="email" placeholder="Enter your email" required>

                    </div>


                    <div class="form-group">

                        <label for="password">Password</label>

                        <input type="password" id="password" name="password" placeholder="Enter your password" required>

                    </div>


                    <div class="form-options">

                        <label class="remember">

                            <input type="checkbox" name="remember">

                            <span>Remember me</span>

                        </label>


                        <a href="#">Forgot password?</a>

                    </div>


                    <button type="submit" class="signin-btn">
                        Sign In
                    </button>

                </form>


                <p class="signup-text">
                    Don't have an account?

                    <a href="signup.html">
                        Sign Up
                    </a>
                </p>

            </div>

        </section>

    </div>

</body>

</html>
